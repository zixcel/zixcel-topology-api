[package]
exclude = ["*.tgz", "**/*.tgz", "/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "zixcel-topology-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Metadata-only operational topology API for Zixcel"
license = "Apache-2.0"
publish = false

[workspace]
members = ["."]
resolver = "3"

[dependencies]
base64 = "0.22.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
nix = { version = "0.29.0", features = ["user"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tiny_http = "0.12.0"
time = { version = "0.3.47", features = ["formatting", "macros"] }
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
